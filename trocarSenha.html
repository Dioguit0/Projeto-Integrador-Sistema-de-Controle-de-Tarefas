<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Tarefas - Redefinir Senha</title>
    <link rel="stylesheet" href="style.css">
    <script src="usuario.js" defer></script>

</head>
<body>
    <header>
        <h1>Redefinir Senha</h1>
    </header>
    <main>
        <div id="caixaCadastro">
            <form id="form-trocar-senha">

                <label for="troca-email">E-mail cadastrado:</label>
                <input type="email" id="troca-email" required>

                <label for="troca-nova-senha">Nova Senha:</label>
                <input type="password" id="troca-nova-senha" required>

                <label for="troca-confirma-senha">Confirmar Nova Senha:</label>
                <input type="password" id="troca-confirma-senha" required>

                <button type="submit">Alterar Senha</button>

            </form>
            <br>
            <button id="btn-voltar-login" type="button">Voltar ao Login</button>
        </div>
    </main>


</body>
</html>
